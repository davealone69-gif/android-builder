kind = "mobile"
previewPath = "/android-builder/"
title = "Android Builder"
description = "A mobile-first Android app builder for generating Kotlin and Python project code with AI assistance, learning notes, self-repair runs, and GitHub Actions build handoffs."
version = "1.0.0"
id = "artifacts/android-builder"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/android-builder/" ]
localPort = 23718

[services.development]
run = "pnpm --filter @workspace/android-builder run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/android-builder", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/android-builder", "run", "serve" ]

[services.env]
PORT = "23718"
BASE_PATH = "/android-builder/"
